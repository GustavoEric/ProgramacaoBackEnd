<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .pokemon {
            border: 2px solid #ff0000;
            border-radius: 10px;
            padding: 15px;
            margin: 15px;
            background-color: #fff;
            width: 200px;
            text-align: center;
            box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
        }
        .pokemon img {
            width: 120px;
            height: 120px;
        }
        .pokemon h3 {
            color: #ff0000;
        }
        .pokemon p {
            margin: 5px 0;
        }
        .type {
            display: inline-block;
            padding: 5px 10px;
            margin: 3px;
            border-radius: 5px;
            color: #fff;
            font-size: 14px;
        }
        .fire { background-color: #f08030; }
        .water { background-color: #6890f0; }
        .grass { background-color: #78c850; }
        .electric { background-color: #f8d030; }
        .psychic { background-color: #f85888; }
        .ice { background-color: #98d8d8; }
        .dragon { background-color: #7038f8; }
        .dark { background-color: #705848; }
        .fairy { background-color: #ee99ac; }
        .normal { background-color: #a8a878; }
        .fighting { background-color: #c03028; }
        .flying { background-color: #a890f0; }
        .poison { background-color: #a040a0; }
        .ground { background-color: #e0c068; }
        .rock { background-color: #b8a038; }
        .bug { background-color: #a8b820; }
        .ghost { background-color: #705898; }
        .steel { background-color: #b8b8d0; }
    </style>
</head>
<body>
    <h1 style="color: #ff0000;">Pokédex</h1>
    <div class="container" id="pokedex"></div>

    <script>
        async function getPokemonData(id) {
            const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
            return response.json();
        }

        async function loadPokedex() {
            const pokedex = document.getElementById("pokedex");
            for (let i = 1; i <= 251; i++) {
                const pokemon = await getPokemonData(i);
                const types = pokemon.types.map(type => `<span class="type ${type.type.name}">${type.type.name.toUpperCase()}</span>`).join(' ');
                
                const pokemonElement = `
                    <div class="pokemon">
                        <h3>#${pokemon.id} - ${pokemon.name.toUpperCase()}</h3>
                        <img src="${pokemon.sprites.front_default}" alt="${pokemon.name}">
                        <p><strong>Altura:</strong> ${pokemon.height / 10} m</p>
                        <p><strong>Peso:</strong> ${pokemon.weight / 10} kg</p>
                        <p><strong>Tipos:</strong> ${types}</p>
                    </div>
                `;
                
                pokedex.innerHTML += pokemonElement;
            }
        }

        loadPokedex();
    </script>
</body>
</html>
